<html> 
 <head> 
  <meta charset="UTF-8"> 
  
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_malik() 
   { 
 var a_mal= parseFloat(document.getElementById('dlugosc').value); 
 var b_mal= a_mal*a_mal; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_mal.toFixed(2)+" cm^2";  
   } 
  function obwod_malik() 
   { 
 var a_mal= parseFloat(document.getElementById('dlugosc').value); 
 var b_mal= 4*a_mal; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_mal.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_malik()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_malik()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body> 
</html>
