   {

 document.getElementById("nazwa").innerHTML ="Bok AB= "+AB.toFixed(2)+" cm";

  function BC_malik() 
   {

  function CA_malik() 
   {

 var xa_mal= parseFloat(document.getElementById('xa').value);

var AB=Math.sqrt(Math.pow(xc-xa,2)+Math.pow(yc-ya,2));
 document.getElementById("nazwa").innerHTML ="Bok CA= "+b_mal.toFixed(2)+" cm";  
   } 
 </script>
